<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>sharelab</title>

    <!-- GitHub Pages serves static files only, so a real 301 is not available.
         The refresh moves people, and the canonical tells search engines which
         URL is the real one so this page does not compete with the blog. -->
    <meta http-equiv="refresh" content="0; url=/sharelab/" />
    <link rel="canonical" href="https://angelline2005.github.io/sharelab/" />
    <meta name="robots" content="noindex, follow" />

    <style>
      body {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        display: grid;
        place-content: center;
        min-height: 100vh;
        margin: 0;
        color-scheme: light dark;
      }
      p { font-size: 1.1rem; }
    </style>
  </head>
  <body>
    <!-- Visible for anyone whose browser ignores the refresh, and for crawlers
         that read markup but do not follow it. -->
    <p><a href="/sharelab/">sharelab &rarr;</a></p>
  </body>
</html>
